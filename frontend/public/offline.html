<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HabitTrack Offline</title>
    <meta name="theme-color" content="#8b5cf6" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Outfit, Inter, system-ui, sans-serif;
        background: radial-gradient(circle at top, #241238 0%, #0a0910 65%);
        color: #fff;
      }
      main {
        max-width: 24rem;
        margin: 1rem;
        padding: 2rem;
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #d1d5db;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>HabitTrack will sync your latest data when the internet connection returns.</p>
    </main>
  </body>
</html>
